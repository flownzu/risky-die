name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version aus dem Tag in module.json setzen
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' module.json > module.tmp && mv module.tmp module.json
      - name: Zip bauen
        run: zip -r risky-die.zip module.json scripts styles lang README.md
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" module.json risky-die.zip --title "$GITHUB_REF_NAME" --generate-notes
